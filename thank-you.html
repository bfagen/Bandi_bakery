<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bandi Bakery — Thank you</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thanks{
      min-height: calc(100vh - 140px);
      display: grid;
      place-items: center;
      padding: 34px 0 54px;
      text-align: center;
    }
    .thanks-card{
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(31,23,17,0.12);
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(31,23,17,0.10);
      padding: 24px 22px 18px;
      width: min(560px, calc(100% - 40px));
    }
    .thanks-logo{
      width: 160px;
      height: 160px;
      object-fit: contain;
      opacity: 0.90;
      display: block;
      margin: 0 auto 10px;
    }
    .thanks-title{
      margin: 0;
      font-weight: 950;
      font-size: 24px;
    }
    .thanks-sub{
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">Bandi Bakery</span>
          <span class="brand-sub">Your neighborhood bakery</span>
        </span>
      </a>

      <nav class="nav">
        <a class="nav-link" href="index.html">Menu</a>
        <a class="nav-link" href="order.html">Order</a>
        <a class="nav-link" href="about.html">About</a>
        <img class="nav-logo" src="Images/logo.png" alt="Bandi Bakery logo" loading="eager">
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="thanks-card">
        <img class="thanks-logo" src="Images/logo.png" alt="Bandi Bakery logo">
        <h1 class="thanks-title">Thank you for your order!</h1>
        <p class="thanks-sub">
          We’ll confirm by email/text. Your items will be ready by 2pm on your pickup day.
          Questions: thebandibakery@gmail.com
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div>
        <div class="footer-title">Bandi Bakery LLC</div>
        <div class="footer-sub">Pickup stand • 6214 W. 67th Ter. OP, KS</div>
      </div>

      <div class="footer-links footer-links-with-logo">
        <a href="index.html#menu">Menu</a>
        <a href="order.html">Order</a>
        <a href="about.html">About</a>
        <img class="footer-logo" src="Images/logo.png" alt="Bandi Bakery logo" loading="lazy">
      </div>
    </div>
  </footer>
</body>
</html>
